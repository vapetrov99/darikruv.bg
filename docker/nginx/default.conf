server {
    listen 80;

    root /var/www/html;
    index index.php index.html;

    # Security headers (defense-in-depth on browser side)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://www.google.com https://www.googleapis.com https://fcmregistrations.googleapis.com https://ncth.bg; frame-src https://www.openstreetmap.org;" always;
    # Effective only when served over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block secrets / internal trees (prefix match, highest priority among these).
    location ^~ /config/ { return 404; }
    location ^~ /services/ { return 404; }
    location ^~ /vendor/ { return 404; }
    location ^~ /api/helpers/ { return 404; }
    location ^~ /api/routes/ { return 404; }

    location ~* /\.(env|git|htaccess|htpasswd) {
        return 404;
    }

    location ~* \.(sql|md|json)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only public PHP entrypoints.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location = /api/index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    # Deny any other PHP file.
    location ~ \.php$ {
        return 404;
    }
}
