<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки за кръв</title>
    <link rel="stylesheet" href="../css/style_test1.css">
    <link rel="stylesheet" href="../css/request.css">
</head>
<body>

<header class="header">
    <div class="container nav-container">
        <h1 class="logo">Кръводарители</h1>
        <nav class="nav">
            <a href="index.html">Начало</a>
            <a href="request.html">Заявки</a>
            <a href="donors.html">Дарители</a>
            <a href="register.html">Регистрация</a>
            <a href="login.html" class="btn btn-nav">Вход</a>
        </nav>
    </div>
</header>

<main class="requests-page">
    <div class="container">
        <div class="requests-header">
            <div>
                <h2>Заявки за кръв</h2>
                <p>Избери град, за да видиш активните заявки за кръводаряване.</p>
            </div>

            <a href="create-request.html" class="btn create-request-btn">
                Създай заявка
            </a>
        </div>

        <div class="requests-layout">
            <aside class="cities-sidebar">
                <h3>Градове</h3>

                <button class="city-btn active" data-city="София">София</button>
                <button class="city-btn" data-city="Пловдив">Пловдив</button>
                <button class="city-btn" data-city="Варна">Варна</button>
                <button class="city-btn" data-city="Бургас">Бургас</button>
                <button class="city-btn" data-city="Русе">Русе</button>
                <button class="city-btn" data-city="Стара Загора">Стара Загора</button>
                <button class="city-btn" data-city="Плевен">Плевен</button>
                <button class="city-btn" data-city="Сливен">Сливен</button>
                <button class="city-btn" data-city="Добрич">Добрич</button>
                <button class="city-btn" data-city="Шумен">Шумен</button>
                <button class="city-btn" data-city="Перник">Перник</button>
                <button class="city-btn" data-city="Хасково">Хасково</button>
                <button class="city-btn" data-city="Ямбол">Ямбол</button>
                <button class="city-btn" data-city="Пазарджик">Пазарджик</button>
                <button class="city-btn" data-city="Благоевград">Благоевград</button>
                <button class="city-btn" data-city="Велико Търново">Велико Търново</button>
                <button class="city-btn" data-city="Враца">Враца</button>
                <button class="city-btn" data-city="Габрово">Габрово</button>
                <button class="city-btn" data-city="Кърджали">Кърджали</button>
                <button class="city-btn" data-city="Кюстендил">Кюстендил</button>
                <button class="city-btn" data-city="Ловеч">Ловеч</button>
                <button class="city-btn" data-city="Монтана">Монтана</button>
                <button class="city-btn" data-city="Разград">Разград</button>
                <button class="city-btn" data-city="Силистра">Силистра</button>
                <button class="city-btn" data-city="Смолян">Смолян</button>
                <button class="city-btn" data-city="Търговище">Търговище</button>
                <button class="city-btn" data-city="Видин">Видин</button>
            </aside>

            <section class="requests-content">
                <div class="selected-city-box">
                    <h3 id="selectedCityTitle">София</h3>
                    <p>Активни заявки в избрания град</p>
                </div>

                <div id="requestsList" class="requests-list">
                    <!-- Заявките ще се зареждат от JS -->
                </div>

                <p id="emptyMessage" class="empty-message">
                    Няма активни заявки.
                </p>
            </section>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 Кръводарители. Всички права запазени.</p>
    </div>
</footer>

<script src="../js/requests.js"></script>
</body>
</html>
